<table>
    <thead>
        <tr>
            <th>Select</th>
            <th>Policy Number</th>
            <th>Policy Holder</th>
            <th>Status</th>
            <th>Region</th>
        </tr>
    </thead>
    <tbody>
        @for(policy of store.filteredPolicies(); track policy.id){
            <tr>
                <td>
                    <input type="checkbox" [checked]="store.selectedPolicyIds().includes(policy.id)" (change)="store.toggleSelection(policy.id)">
                </td>
                <td>{{ policy.policyNumber }}</td>
                <td>{{ policy.policyHolderName }}</td>
                <td>{{ policy.status }}</td>
                <td>{{ policy.region }}</td>
            </tr>
        }
    </tbody>
</table>
