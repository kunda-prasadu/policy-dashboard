<div class="summary-section">
  <h2 class="summary-section__title">Portfolio Summary</h2>
  <div class="summary-grid">
    <div class="summary-card summary-card--active">
      <div class="summary-card__icon">✓</div>
      <div class="summary-card__body">
        <span class="summary-card__count">{{ activeCount() }}</span>
        <span class="summary-card__label">Active</span>
      </div>
    </div>
    <div class="summary-card summary-card--pending">
      <div class="summary-card__icon">⏳</div>
      <div class="summary-card__body">
        <span class="summary-card__count">{{ pendingCount() }}</span>
        <span class="summary-card__label">Pending</span>
      </div>
    </div>
    <div class="summary-card summary-card--expired">
      <div class="summary-card__icon">⚠</div>
      <div class="summary-card__body">
        <span class="summary-card__count">{{ expiredCount() }}</span>
        <span class="summary-card__label">Expired</span>
      </div>
    </div>
    <div class="summary-card summary-card--cancelled">
      <div class="summary-card__icon">✕</div>
      <div class="summary-card__body">
        <span class="summary-card__count">{{ cancelledCount() }}</span>
        <span class="summary-card__label">Cancelled</span>
      </div>
    </div>
  </div>
</div>
