<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="dashboard-title">
      <h1>Policy Overview Dashboard</h1>
      <span class="dashboard-subtitle">APAC Operations · {{ store.totalPolicies() }} total policies</span>
    </div>
  </header>

  @if (store.loading()) {
    <app-loading-skeleton />
  } @else if (store.error()) {
    <app-error-state
      [message]="store.error()"
      (retryClick)="retry()"
    />
  } @else {
    <section class="dashboard-summary">
      <app-summary-pannl />
    </section>

    <section class="dashboard-filters">
      <app-policy-filter />
    </section>

    <app-bulk-action-bar />

    <section class="dashboard-table">
      <app-policy-table />
    </section>
  }
</div>
