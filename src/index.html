<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Policy Hub — Chubb APAC</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chubb APAC Policy Overview Dashboard — manage and monitor insurance policies across regions.">

  <!-- Security meta tags -->
  <!-- Note: X-Frame-Options and X-Content-Type-Options must be set as HTTP response
       headers at the server/CDN level — meta tags are ignored by browsers for these.
       They are configured in angular.json (dev server) and must be added to your
       production server config (nginx/Apache/Vercel/Netlify _headers). -->
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Preconnect so DNS/TLS is resolved before font requests fire -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Non-render-blocking font loading:
    rel="preload" downloads CSS immediately without blocking rendering.
    onload swaps rel to 'stylesheet' once complete.
    <noscript> provides a fallback for JS-disabled environments.
  -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  </noscript>

  <!-- Material Icons: display=optional — uses cached font or skips, never render-blocks -->
  <link rel="preload"
    href="https://fonts.googleapis.com/icon?family=Material+Icons&display=optional"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=optional" rel="stylesheet">
  </noscript>
</head>
<body>
  <app-root></app-root>
</body>
</html>
