name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npx ng lint --no-progress || true   # advisory only — no lint config committed yet

      - name: Build
        run: npx ng build --configuration production

      - name: Test
        run: npx ng test --no-watch --browsers=ChromeHeadless --no-progress
